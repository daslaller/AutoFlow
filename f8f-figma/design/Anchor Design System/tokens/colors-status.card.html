<!-- @dsCard group="Colors" viewport="700x150" name="Status Colors" subtitle="Semantic pipeline stage colors — never reordered or repurposed" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:16px;display:flex;flex-wrap:wrap;gap:8px">
<div style="background:var(--status-backlog-bg);color:var(--status-backlog-fg);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600">Backlog</div><div style="background:var(--status-triage-bg);color:var(--status-triage-fg);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600">Triage</div><div style="background:var(--status-blocked-bg);color:var(--status-blocked-fg);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600">Blocked</div><div style="background:var(--status-inprogress-bg);color:var(--status-inprogress-fg);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600">In Progress</div><div style="background:var(--status-review-bg);color:var(--status-review-fg);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600">Review</div><div style="background:var(--status-ready-bg);color:var(--status-ready-fg);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600">Ready</div><div style="background:var(--status-done-bg);color:var(--status-done-fg);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600">Done</div><div style="background:var(--status-cancelled-bg);color:var(--status-cancelled-fg);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600">Cancelled</div>
</div>
