<body>
<div class="page-h">
  <h1>F8F — node hunt, round 3: scale</h1>
  <p>Orbit at two larger sizes, plus the card-shaped looks blown up to match. Same graph, mid-preview.</p>
</div>
<div id="gallery"></div>
<script>
const ICONS = {
  trigger:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  action:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 6 6 6-6 6"/></svg>',
  condition:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5h7"/><path d="m15 10 3 3-3 3"/></svg>',
  output:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>',
};
const KIND_LABEL = { trigger:'TRIGGER', action:'ACTION', condition:'LOGIC', output:'OUTPUT' };
const LIGHT = { trigger:'#059669', action:'#2563eb', condition:'#ca8a04', output:'#e11d48' };
const DARK  = { trigger:'#34d399', action:'#60a5fa', condition:'#fbbf24', output:'#fb7185' };

const GRAPH = [
  { id:'n1', kind:'trigger',   title:'Ticket Created', meta:'shop.ticket.new',   col:0, row:0,     st:'success',  outs:['out'] },
  { id:'n2', kind:'action',    title:'HTTP Request',   meta:'GET /crm/customer', col:1, row:0,     st:'success',  ins:['in'], outs:['out'] },
  { id:'n3', kind:'condition', title:'If / Else',      meta:'status == intake',  col:2, row:0,     st:'selected', ins:['in'], outs:['true','false'] },
  { id:'n4', kind:'action',    title:'Send Message',   meta:'Welcome SMS',       col:3, row:-0.68, st:'running',  ins:['in'], outs:['out'] },
  { id:'n5', kind:'output',    title:'Notify Tech',    meta:'tech.assigned',     col:3, row:0.78,  st:'idle',     ins:['in'] },
];
const LINKS = [['n1','out','n2','in'],['n2','out','n3','in'],['n3','true','n4','in'],['n3','false','n5','in']];

const dot = (n,p,d,i) => `<i class="dot p${i}" data-node="${n.id}" data-port="${p}" data-dir="${d}"></i>`;
const outs = n => n.outs || [], ins = n => n.ins || [];
const labelled = (n,p,d,i) => (outs(n).length>1 ? `<span class="plabel l${i}">${p}</span>` : '') + dot(n,p,d,i);
const pin = n => ins(n).length ? `<div class="pin">${ins(n).map((p,i)=>dot(n,p,'in',i)).join('')}</div>` : '';
const pout = (n,f=dot) => outs(n).length
  ? `<div class="pout${outs(n).length>1?' multi':''}">${outs(n).map((p,i)=>f(n,p,'out',i)).join('')}</div>` : '';
const st2 = st => st==='success' ? '<span class="badge2 ok">0.4s</span>'
  : st==='running' ? '<span class="badge2 live">RUNNING</span>'
  : st==='error' ? '<span class="badge2 bad">FAILED</span>' : '';
const orbitBadge = st => st==='success' ? '<span class="badge ok">0.4s</span>'
  : st==='running' ? '<span class="badge live">RUNNING</span>'
  : st==='error' ? '<span class="badge bad">FAILED</span>' : '';

const orbitTpl = (n, st) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
  <div class="disc">${ICONS[n.kind]}</div>${orbitBadge(st)}
  <div class="kindlabel">${KIND_LABEL[n.kind]}</div>
  <div class="t">${n.title}</div><div class="m">${n.meta}</div>
  ${pin(n)}${pout(n, labelled)}</div>`;

const VARIANTS = [
  { slug:'orbitL', fam:'orbit', name:'Orbit L', tags:'108px disc · kind label · config pill',
    why:'The favourite, one size up. Kind label added above the title, config moved into a pill so it reads as a value, not a caption.',
    palette:LIGHT, colW:238, rowH:170, baseY:130, wire:{w:2.6}, tpl:orbitTpl },
  { slug:'orbitXL', fam:'orbit', name:'Orbit XL', tags:'140px disc · maximum presence',
    why:'As big as the disc can get before an eight-step flow stops fitting on screen. The ring becomes a real progress gauge at this size.',
    palette:LIGHT, colW:276, rowH:190, baseY:155, wire:{w:3}, tpl:orbitTpl },
  { slug:'plateXL', fam:'plate', name:'Orbit Plate XL', tags:'104px disc + plate · hybrid',
    why:'Same big disc, but the label lives on a plate welded to its side — keeps the round read while giving the text a proper home.',
    palette:LIGHT, colW:262, rowH:152, baseY:172, wire:{w:2.6},
    tpl: (n, st) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
      <div class="disc">${ICONS[n.kind]}</div>${orbitBadge(st)}
      <div class="plate"><div class="kindlabel">${KIND_LABEL[n.kind]}</div>
        <div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
      ${pin(n)}${pout(n, labelled)}</div>` },
  { slug:'softXL', fam:'soft', name:'Soft Product XL', tags:'268px card · 52px tile',
    why:'The light card at the same visual weight as Orbit XL — bigger tile, 16px title, branch chips as real buttons.',
    palette:LIGHT, colW:285, rowH:175, baseY:150, wire:{w:2.8},
    tpl: (n, st) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
      <div class="rowtop"><div class="itile">${ICONS[n.kind]}</div>
        <div><div class="kindlabel">${KIND_LABEL[n.kind]}</div><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
        ${st2(st)}</div>
      ${outs(n).length>1 ? `<div class="foot">${outs(n).map(p=>`<span class="badge">${p.toUpperCase()}</span>`).join('')}</div>` : ''}
      ${pin(n)}${pout(n)}</div>` },
  { slug:'glassXL', fam:'glass', name:'Glass XL', tags:'264px card · dark',
    why:'The dark twin at the larger size — icon tile added so it carries the same silhouette as Soft Product.',
    palette:DARK, colW:285, rowH:175, baseY:150, wire:{w:2.8, glow:true},
    tpl: (n, st) => `<div class="node st-${st}" style="--k:${DARK[n.kind]}">
      <div class="rowtop"><div class="itile">${ICONS[n.kind]}</div>
        <div><div class="kindlabel">${KIND_LABEL[n.kind]}</div><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
        ${st2(st)}</div>
      ${outs(n).length>1 ? `<div class="foot">${outs(n).map(p=>`<span class="badge">${p.toUpperCase()}</span>`).join('')}</div>` : ''}
      ${pin(n)}${pout(n)}</div>` },
  { slug:'cardXL', fam:'card', name:'Card XL', tags:'262px card · header band',
    why:'The classic scaled up for reference — this is the baseline every other look has to beat.',
    palette:LIGHT, colW:285, rowH:175, baseY:145, wire:{w:2.8},
    tpl: (n, st) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
      <div class="head">${ICONS[n.kind]}${KIND_LABEL[n.kind]}${st2(st)}</div>
      <div class="body"><div class="t">${n.title}</div><div class="m">${n.meta}</div>
        ${outs(n).length>1 ? `<div class="foot">${outs(n).map(p=>`<span class="badge">${p.toUpperCase()}</span>`).join('')}</div>` : ''}</div>
      ${pin(n)}${pout(n, labelled)}</div>` },
];

const gallery = document.getElementById('gallery');
VARIANTS.forEach((V, vi) => {
  const tile = document.createElement('section');
  tile.className = `tile v-${V.slug} fam-${V.fam}`;
  tile.id = 'tile-' + V.slug;
  tile.innerHTML = `<div class="tile-h"><span class="num">${String(vi+1).padStart(2,'0')}</span>
    <h2>${V.name}</h2><span class="tag">${V.tags}</span><span class="why">${V.why}</span></div>
    <div class="stage"><svg class="wires"></svg></div>`;
  gallery.appendChild(tile);
  const stage = tile.querySelector('.stage');
  GRAPH.forEach(n => {
    const box = document.createElement('div');
    box.innerHTML = V.tpl(n, n.st).trim();
    const el = box.firstElementChild;
    el.style.left = (30 + n.col * V.colW) + 'px';
    el.style.top = (V.baseY + n.row * V.rowH) + 'px';
    stage.appendChild(el);
  });
});

requestAnimationFrame(() => {
  VARIANTS.forEach(V => {
    const stage = document.querySelector('#tile-' + V.slug + ' .stage');
    const svg = stage.querySelector('svg.wires');
    const sb = stage.getBoundingClientRect();
    const at = (nid, port, dir) => {
      const d = stage.querySelector(`.dot[data-node="${nid}"][data-port="${port}"][data-dir="${dir}"]`);
      if (!d) return null;
      const r = d.getBoundingClientRect();
      return { x: r.left - sb.left + r.width / 2, y: r.top - sb.top + r.height / 2 };
    };
    let out = '';
    LINKS.forEach(([a, ap, b, bp]) => {
      const p = at(a, ap, 'out'), q = at(b, bp, 'in');
      if (!p || !q) return;
      const stroke = V.palette[GRAPH.find(n => n.id === a).kind];
      const dx = Math.max(48, Math.abs(q.x - p.x) * 0.5);
      const glow = V.wire.glow ? `filter="url(#glow-${V.slug})"` : '';
      out += `<path d="M${p.x} ${p.y} C${p.x+dx} ${p.y}, ${q.x-dx} ${q.y}, ${q.x} ${q.y}" fill="none"
        stroke="${stroke}" stroke-width="${V.wire.w}" stroke-linecap="round" ${glow}/>`;
    });
    svg.innerHTML = `<defs><filter id="glow-${V.slug}" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter></defs>` + out;
  });
  document.body.dataset.wired = 'yes';
});
</script>
</body>
</html>
