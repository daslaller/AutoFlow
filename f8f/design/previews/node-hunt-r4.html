<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>F8F — Orbit L, glow pass</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eceff3; color: #0f172a; padding: 28px; }
  .page-h { max-width: 1160px; margin: 0 auto 22px; }
  .page-h h1 { font-size: 20px; margin: 0 0 4px; }
  .page-h p { margin: 0; font-size: 13px; color: #64748b; }
  .tile { max-width: 1160px; margin: 0 auto 26px; background: #fff; border-radius: 14px;
    border: 1px solid #dde3ec; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
  .tile-h { padding: 14px 18px; border-bottom: 1px solid #eef2f7; display: flex; align-items: baseline; gap: 10px; }
  .tile-h .num { font: 600 11px ui-monospace, Menlo, monospace; color: #94a3b8; }
  .tile-h h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .tile-h .tag { font-size: 11px; color: #64748b; }
  .tile-h .why { margin-left: auto; font-size: 12px; color: #64748b; max-width: 520px; text-align: right; }
  .stage { position: relative; overflow: hidden; height: 470px;
    background: radial-gradient(130% 110% at 18% 0%, #fcfdff, #e6edf7); }
  .stage svg.wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 0; }
  .stage .node { position: absolute; z-index: 1; }
  .strip { display: flex; flex-wrap: wrap; gap: 28px 34px; padding: 34px 26px 24px;
    background: radial-gradient(130% 110% at 18% 0%, #fcfdff, #e6edf7); }
  .strip .node { position: relative; }
  .strip .cap { margin-top: 14px; font: 600 10px ui-sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: #94a3b8; text-align: center; width: 150px; }

  /* ---- Orbit L: no tint, thin ring, glow follows the run status ---- */
  .node { width: 150px; text-align: center; --ringw: 2px; --glowc: var(--k); }
  .disc { width: 108px; height: 108px; margin: 0 auto; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 50% 26%, #ffffff, #fdfdfe);
    display: grid; place-items: center; color: var(--k);
    box-shadow: 0 8px 18px -12px rgba(15,23,42,.35), 0 1px 2px rgba(15,23,42,.06); }
  /* the ring — thin, and the glow radiates from it */
  .disc::before { content: ""; position: absolute; inset: calc(var(--ringw) * -1); border-radius: 50%; z-index: 0;
    background: conic-gradient(var(--ring, var(--k)) var(--pct, 100%), #dde5ef 0);
    box-shadow: 0 0 var(--gb) var(--gs) color-mix(in srgb, var(--glowc) var(--ga), transparent); }
  /* mask the ring's centre so only the rim shows — no kind tint inside */
  .disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; z-index: 1;
    background: radial-gradient(circle at 50% 26%, #ffffff, #fdfdfe); }
  .disc svg { width: 36px; height: 36px; position: relative; z-index: 2; }
  .kindlabel { position: relative; z-index: 2; margin-top: 13px; font: 700 8.5px ui-sans-serif;
    letter-spacing: .16em; color: color-mix(in srgb, var(--k) 80%, #64748b); }
  .t { margin-top: 4px; font-size: 14px; font-weight: 650; line-height: 1.22; letter-spacing: -.01em; }
  .m { display: inline-block; margin-top: 6px; max-width: 100%; font: 11px ui-monospace, Menlo, monospace;
    color: #7c8899; background: rgba(255,255,255,.8); border: 1px solid #e6ecf4; border-radius: 999px;
    padding: 2px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); z-index: 3;
    font: 700 8.5px ui-sans-serif; letter-spacing: .1em; padding: 3px 9px; border-radius: 999px; color: #fff;
    white-space: nowrap; box-shadow: 0 3px 8px -2px rgba(15,23,42,.4); }
  .badge.ok { background: #16a34a; } .badge.live { background: #2563eb; } .badge.bad { background: #dc2626; }

  .node.st-selected .disc { box-shadow: 0 0 0 4px #fff, 0 0 0 6px rgba(15,23,42,.42),
    0 10px 22px -12px rgba(15,23,42,.4); }
  .node.st-running .disc { --ring: #2563eb; --pct: 68%; --glowc: #2563eb; }
  .node.st-success .disc { --ring: #16a34a; --glowc: #16a34a; }
  .node.st-error   .disc { --ring: #dc2626; --glowc: #dc2626; }
  .node.st-collapsed .kindlabel, .node.st-collapsed .t, .node.st-collapsed .m { display: none; }

  .dot { position: absolute; width: 13px; height: 13px; border-radius: 50%; background: var(--k);
    border: 3px solid #fff; box-shadow: 0 1px 3px rgba(15,23,42,.28); z-index: 4; }
  .pin .dot { left: 14px; top: 47px; }
  .pout .dot { right: 14px; }
  .pout .dot.p0 { top: 47px; }
  .pout.multi .dot.p0 { top: 15px; right: 22px; }
  .pout.multi .dot.p1 { top: 79px; right: 22px; }
  .plabel { position: absolute; font: 700 8.5px ui-sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: color-mix(in srgb, var(--k) 85%, #475569); z-index: 4; }
  .plabel.l0 { top: 2px; right: 6px; } .plabel.l1 { top: 92px; right: 4px; }

  /* glow levels */
  .g-soft   .node { --gb: 20px; --gs: -4px; --ga: 42%; }
  .g-med    .node { --gb: 30px; --gs: -1px; --ga: 52%; }
  .g-strong .node { --gb: 42px; --gs: 3px;  --ga: 62%; --ringw: 1.5px; }
</style>
</head>
<body>
<div class="page-h">
  <h1>F8F — Orbit L, glow pass</h1>
  <p>108px disc, no kind tint inside, thin ring. Three glow strengths, then every state at the middle one.</p>
</div>
<div id="gallery"></div>
<script>
const ICONS = {
  trigger:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  action:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 6 6 6-6 6"/></svg>',
  condition:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5h7"/><path d="m15 10 3 3-3 3"/></svg>',
  output:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>',
};
const KIND_LABEL = { trigger:'TRIGGER', action:'ACTION', condition:'LOGIC', output:'OUTPUT' };
const LIGHT = { trigger:'#059669', action:'#2563eb', condition:'#ca8a04', output:'#e11d48' };

const GRAPH = [
  { id:'n1', kind:'trigger',   title:'Ticket Created', meta:'shop.ticket.new',   col:0, row:0,     st:'success',  outs:['out'] },
  { id:'n2', kind:'action',    title:'HTTP Request',   meta:'GET /crm/customer', col:1, row:0,     st:'success',  ins:['in'], outs:['out'] },
  { id:'n3', kind:'condition', title:'If / Else',      meta:'status == intake',  col:2, row:0,     st:'selected', ins:['in'], outs:['true','false'] },
  { id:'n4', kind:'action',    title:'Send Message',   meta:'Welcome SMS',       col:3, row:-0.72, st:'running',  ins:['in'], outs:['out'] },
  { id:'n5', kind:'output',    title:'Notify Tech',    meta:'tech.assigned',     col:3, row:0.80,  st:'idle',     ins:['in'] },
];
const LINKS = [['n1','out','n2','in'],['n2','out','n3','in'],['n3','true','n4','in'],['n3','false','n5','in']];

const dot = (n,p,d,i) => `<i class="dot p${i}" data-node="${n.id}" data-port="${p}" data-dir="${d}"></i>`;
const outs = n => n.outs || [], ins = n => n.ins || [];
const labelled = (n,p,d,i) => (outs(n).length>1 ? `<span class="plabel l${i}">${p}</span>` : '') + dot(n,p,d,i);
const pin = n => ins(n).length ? `<div class="pin">${ins(n).map((p,i)=>dot(n,p,'in',i)).join('')}</div>` : '';
const pout = n => outs(n).length
  ? `<div class="pout${outs(n).length>1?' multi':''}">${outs(n).map((p,i)=>labelled(n,p,'out',i)).join('')}</div>` : '';
const badge = st => st==='success' ? '<span class="badge ok">0.4s</span>'
  : st==='running' ? '<span class="badge live">RUNNING</span>'
  : st==='error' ? '<span class="badge bad">FAILED</span>' : '';

const tpl = (n, st) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
  <div class="disc">${ICONS[n.kind]}</div>${badge(st)}
  <div class="kindlabel">${KIND_LABEL[n.kind]}</div>
  <div class="t">${n.title}</div><div class="m">${n.meta}</div>
  ${pin(n)}${pout(n)}</div>`;

const TILES = [
  { slug:'soft', glow:'g-soft', name:'Soft glow', tags:'2px ring · 20px bloom',
    why:'Barely there — the disc reads as lit rather than glowing. Safest at 40 nodes on screen.' },
  { slug:'med', glow:'g-med', name:'Medium glow', tags:'2px ring · 30px bloom',
    why:'The one I would ship. Enough halo to separate the disc from the canvas without smearing at density.' },
  { slug:'strong', glow:'g-strong', name:'Strong glow', tags:'1.5px hairline ring · 42px bloom',
    why:'Hairline ring, big bloom, and the links glow too. Most dramatic; the halos start to touch when nodes sit close.',
    wireGlow: true },
];

const gallery = document.getElementById('gallery');
TILES.forEach((T, ti) => {
  const tile = document.createElement('section');
  tile.className = `tile ${T.glow}`;
  tile.id = 'tile-' + T.slug;
  tile.innerHTML = `<div class="tile-h"><span class="num">${String(ti+1).padStart(2,'0')}</span>
    <h2>${T.name}</h2><span class="tag">${T.tags}</span><span class="why">${T.why}</span></div>
    <div class="stage"><svg class="wires"></svg></div>`;
  gallery.appendChild(tile);
  const stage = tile.querySelector('.stage');
  GRAPH.forEach(n => {
    const box = document.createElement('div');
    box.innerHTML = tpl(n, n.st).trim();
    const el = box.firstElementChild;
    el.style.left = (34 + n.col * 240) + 'px';
    el.style.top = (140 + n.row * 168) + 'px';
    stage.appendChild(el);
  });
});

// states, at the middle glow
const STATES = [
  ['idle', 'idle'], ['selected', 'selected'], ['running', 'running'],
  ['success', 'success'], ['error', 'error'], ['collapsed', 'collapsed'],
];
const stTile = document.createElement('section');
stTile.className = 'tile g-med';
stTile.id = 'tile-states';
stTile.innerHTML = `<div class="tile-h"><span class="num">04</span><h2>States</h2>
  <span class="tag">medium glow</span>
  <span class="why">The glow takes the status colour, so a running step pulses blue and a failed one bleeds red without any extra chrome.</span></div>`;
gallery.appendChild(stTile);
const strip = document.createElement('div');
strip.className = 'strip';
strip.innerHTML = STATES.map(([st, cap]) => {
  const src = st === 'idle'
    ? { id:'x'+st, kind:'condition', title:'If / Else', meta:'status == intake', ins:['in'], outs:['true','false'] }
    : { id:'x'+st, kind:'action', title:'HTTP Request', meta:'GET /crm/customer', ins:['in'], outs:['out'] };
  return `<div class="cell">${tpl(src, st)}<div class="cap">${cap}</div></div>`;
}).join('');
stTile.appendChild(strip);

requestAnimationFrame(() => {
  TILES.forEach(T => {
    const stage = document.querySelector('#tile-' + T.slug + ' .stage');
    const svg = stage.querySelector('svg.wires');
    const sb = stage.getBoundingClientRect();
    const at = (nid, port, dir) => {
      const d = stage.querySelector(`.dot[data-node="${nid}"][data-port="${port}"][data-dir="${dir}"]`);
      if (!d) return null;
      const r = d.getBoundingClientRect();
      return { x: r.left - sb.left + r.width / 2, y: r.top - sb.top + r.height / 2 };
    };
    let out = '';
    LINKS.forEach(([a, ap, b, bp]) => {
      const p = at(a, ap, 'out'), q = at(b, bp, 'in');
      if (!p || !q) return;
      const stroke = LIGHT[GRAPH.find(n => n.id === a).kind];
      const dx = Math.max(46, Math.abs(q.x - p.x) * 0.5);
      const glow = T.wireGlow ? 'filter="url(#wglow)"' : '';
      out += `<path d="M${p.x} ${p.y} C${p.x+dx} ${p.y}, ${q.x-dx} ${q.y}, ${q.x} ${q.y}" fill="none"
        stroke="${stroke}" stroke-width="2.4" stroke-linecap="round" ${glow}/>`;
    });
    svg.innerHTML = `<defs><filter id="wglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter></defs>` + out;
  });
  document.body.dataset.wired = 'yes';
});
</script>
</body>
</html>
