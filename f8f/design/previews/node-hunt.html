<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>F8F — Node Design Hunt</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eceff3; color: #0f172a; padding: 28px;
  }
  .page-h { max-width: 1100px; margin: 0 auto 22px; }
  .page-h h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .page-h p { margin: 0; font-size: 13px; color: #64748b; }

  .tile {
    max-width: 1100px; margin: 0 auto 26px; background: #fff; border-radius: 14px;
    border: 1px solid #dde3ec; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.05);
  }
  .tile-h { padding: 14px 18px; border-bottom: 1px solid #eef2f7; display: flex; align-items: baseline; gap: 10px; }
  .tile-h .num { font: 600 11px ui-monospace, Menlo, Consolas, monospace; color: #94a3b8; }
  .tile-h h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .tile-h .tag { font-size: 11px; color: #64748b; }
  .tile-h .why { margin-left: auto; font-size: 12px; color: #64748b; max-width: 480px; text-align: right; }

  .stage { position: relative; height: 330px; overflow: hidden; }
  .stage svg.wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 0; }
  .stage .node { position: absolute; z-index: 1; }
  .dot { display: block; }

  /* ---------- 1. CARD ---------- */
  .v-card .stage { background-color: #f1f5f9;
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 22px 22px; }
  .v-card .node { width: 208px; background: #fff; border: 1px solid #dbe2ec; border-radius: 10px;
    box-shadow: 0 1px 2px rgba(15,23,42,.07), 0 8px 20px -12px rgba(15,23,42,.25); }
  .v-card .head { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px; color: #fff;
    font: 700 10px/1 ui-sans-serif, system-ui; letter-spacing: .1em; border-radius: 9px 9px 0 0; background: var(--k); }
  .v-card .head svg { width: 13px; height: 13px; }
  .v-card .body { padding: 9px 11px 11px; }
  .v-card .t { font-size: 13px; font-weight: 620; }
  .v-card .m { margin-top: 3px; font: 11px ui-monospace, Menlo, monospace; color: #64748b; }
  .v-card .pin { position: absolute; left: -7px; top: 46px; }
  .v-card .pin .dot, .v-card .pout .dot { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 2px solid var(--k); }
  .v-card .pout { position: absolute; right: -7px; top: 40px; display: flex; flex-direction: column; gap: 9px; }
  .v-card .pout .prow { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .v-card .pout .prow em { font: 500 10px ui-sans-serif; font-style: normal; color: #64748b; background: #f1f5f9; padding: 1px 4px; border-radius: 3px; }
  .v-card .pout .dot { background: var(--k); }

  /* ---------- 2. RAIL ---------- */
  .v-rail .stage { background: #f6f8fb; }
  .v-rail .node { width: 214px; background: #fff; border: 1px solid #e3e8ef; border-radius: 12px;
    box-shadow: 0 2px 4px rgba(15,23,42,.04), 0 12px 28px -18px rgba(15,23,42,.4); display: flex; overflow: hidden; }
  .v-rail .spine { width: 5px; background: var(--k); flex: none; }
  .v-rail .inner { padding: 11px 12px; flex: 1; min-width: 0; }
  .v-rail .kind { font: 700 9px ui-sans-serif; letter-spacing: .14em; color: var(--k); display: flex; align-items: center; gap: 5px; }
  .v-rail .kind svg { width: 11px; height: 11px; }
  .v-rail .t { font-size: 13.5px; font-weight: 620; margin-top: 5px; }
  .v-rail .m { margin-top: 2px; font: 11px ui-monospace, Menlo, monospace; color: #94a3b8; }
  .v-rail .pin { position: absolute; left: -9px; top: 40px; }
  .v-rail .pout { position: absolute; right: -6px; top: 28px; display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
  .v-rail .prow { display: flex; align-items: center; gap: 5px; }
  .v-rail .prow em { font: 600 9px ui-sans-serif; font-style: normal; letter-spacing: .06em; color: #fff; background: var(--k); padding: 2px 5px; border-radius: 4px; }
  .v-rail .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--k); box-shadow: 0 0 0 3px #fff; }

  /* ---------- 3. ROUND / ORBIT ---------- */
  .v-round .stage { background: radial-gradient(120% 100% at 20% 0%, #f8fafc, #e9eef5); }
  .v-round .node { width: 108px; text-align: center; }
  .v-round .disc { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; background: #fff;
    border: 2px solid var(--k); display: grid; place-items: center; color: var(--k);
    box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--k) 60%, transparent); position: relative; }
  .v-round .disc::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: color-mix(in srgb, var(--k) 8%, #fff); }
  .v-round .disc svg { width: 26px; height: 26px; position: relative; z-index: 1; }
  .v-round .t { margin-top: 9px; font-size: 12.5px; font-weight: 620; line-height: 1.25; }
  .v-round .m { font: 10px ui-monospace, Menlo, monospace; color: #94a3b8; margin-top: 2px; }
  .v-round .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--k); border: 2px solid #fff; }
  .v-round .pin .dot { left: 10px; top: 32px; }
  .v-round .pout .dot { right: 10px; }
  .v-round .pout .dot.p0 { top: 32px; }
  .v-round .pout.multi .dot.p0 { top: 6px; right: 18px; }
  .v-round .pout.multi .dot.p1 { top: 58px; right: 18px; }
  .v-round .plabel { position: absolute; font: 700 9px ui-sans-serif; letter-spacing: .08em; color: var(--k); }
  .v-round .plabel.l0 { top: -6px; right: 2px; }
  .v-round .plabel.l1 { top: 68px; right: 0px; }

  /* ---------- 4. PILL / CAPSULE ---------- */
  .v-pill .stage { background: #f4f6fa; }
  .v-pill .node { width: 216px; height: 58px; background: #fff; border: 1px solid #e2e8f0; border-radius: 999px;
    display: flex; align-items: center; gap: 10px; padding: 0 18px 0 6px;
    box-shadow: 0 2px 3px rgba(15,23,42,.05), 0 14px 24px -18px rgba(15,23,42,.55); }
  .v-pill .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--k); color: #fff; display: grid; place-items: center; flex: none; }
  .v-pill .avatar svg { width: 19px; height: 19px; }
  .v-pill .t { font-size: 13px; font-weight: 620; line-height: 1.2; }
  .v-pill .m { font: 10.5px ui-monospace, Menlo, monospace; color: #94a3b8; }
  .v-pill .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--k); border: 2px solid #fff; box-shadow: 0 0 0 1px #cbd5e1; }
  .v-pill .pin .dot { left: -5px; top: 24px; }
  .v-pill .pout .dot { right: -5px; }
  .v-pill .pout .dot.p0 { top: 24px; }
  .v-pill .pout.multi .dot.p0 { top: 10px; right: 2px; }
  .v-pill .pout.multi .dot.p1 { top: 38px; right: 2px; }
  .v-pill .plabel { position: absolute; font: 700 9px ui-sans-serif; letter-spacing: .08em; color: var(--k); right: 14px; }
  .v-pill .plabel.l0 { top: 5px; }
  .v-pill .plabel.l1 { top: 33px; }

  /* ---------- 5. CHIP ---------- */
  .v-chip .stage { background-color: #eef1f6;
    background-image: linear-gradient(#e0e5ee 1px, transparent 1px), linear-gradient(90deg, #e0e5ee 1px, transparent 1px);
    background-size: 20px 20px; }
  .v-chip .node { height: 36px; max-width: 214px; background: #fff; border: 1px solid #cfd7e3; border-radius: 7px;
    display: flex; align-items: center; gap: 7px; padding: 0 11px 0 9px; box-shadow: 0 1px 1px rgba(15,23,42,.06); }
  .v-chip .swatch { width: 16px; height: 16px; border-radius: 4px; background: var(--k); color: #fff; display: grid; place-items: center; flex: none; }
  .v-chip .swatch svg { width: 10px; height: 10px; }
  .v-chip .t { font: 600 12px ui-sans-serif; white-space: nowrap; }
  .v-chip .m { max-width: 108px; overflow: hidden; text-overflow: ellipsis; }
  .v-chip .m { font: 10px ui-monospace, Menlo, monospace; color: #a3adbd; white-space: nowrap; }
  .v-chip .dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 2px solid var(--k); }
  .v-chip .pin .dot { left: -5px; top: 14px; }
  .v-chip .pout .dot { right: -5px; background: var(--k); }
  .v-chip .pout .dot.p0 { top: 14px; }
  .v-chip .pout.multi .dot.p0 { top: 4px; }
  .v-chip .pout.multi .dot.p1 { top: 24px; }
  .v-chip .plabel { position: absolute; right: -34px; font: 500 9px ui-sans-serif; color: #94a3b8; }

  /* ---------- 6. GLASS ---------- */
  .v-glass .stage { background:
    radial-gradient(60% 80% at 15% 10%, rgba(56,189,248,.18), transparent 60%),
    radial-gradient(50% 70% at 85% 90%, rgba(168,85,247,.18), transparent 60%), #0b1220; }
  .v-glass .node { width: 210px; border-radius: 14px; padding: 12px 13px;
    background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(12px); box-shadow: 0 20px 40px -22px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.14); }
  .v-glass .node::before { content: ""; position: absolute; left: 13px; right: 13px; top: 0; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--k), transparent); }
  .v-glass .kind { display: flex; align-items: center; gap: 6px; font: 700 9px ui-sans-serif; letter-spacing: .16em; color: var(--k); }
  .v-glass .kind svg { width: 11px; height: 11px; }
  .v-glass .t { color: #f1f5f9; font-size: 13.5px; font-weight: 600; margin-top: 7px; }
  .v-glass .m { font: 11px ui-monospace, Menlo, monospace; color: rgba(226,232,240,.5); margin-top: 3px; }
  .v-glass .dot { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--k);
    box-shadow: 0 0 10px 2px color-mix(in srgb, var(--k) 70%, transparent); }
  .v-glass .pin .dot { left: -5px; top: 34px; }
  .v-glass .pout .dot { right: -5px; }
  .v-glass .pout .dot.p0 { top: 34px; }
  .v-glass .pout.multi .dot.p0 { top: 22px; }
  .v-glass .pout.multi .dot.p1 { top: 52px; }
  .v-glass .plabel { position: absolute; right: 12px; font: 600 9px ui-sans-serif; letter-spacing: .1em; color: rgba(226,232,240,.55); }

  /* ---------- 7. NEON TERMINAL ---------- */
  .v-neon .stage { background-color: #05070a;
    background-image: linear-gradient(rgba(56,189,248,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,.06) 1px, transparent 1px);
    background-size: 26px 26px; }
  .v-neon .node { width: 208px; background: #0a0f16; border: 1px solid var(--k); border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 18px -4px color-mix(in srgb, var(--k) 55%, transparent); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .v-neon .head { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-bottom: 1px solid color-mix(in srgb, var(--k) 35%, transparent);
    background: color-mix(in srgb, var(--k) 12%, transparent); color: var(--k); font-size: 9.5px; letter-spacing: .2em; font-weight: 700; }
  .v-neon .head svg { width: 11px; height: 11px; }
  .v-neon .body { padding: 9px; }
  .v-neon .t { color: #e2e8f0; font-size: 12.5px; font-weight: 600; letter-spacing: .01em; }
  .v-neon .m { color: #4d6070; font-size: 10.5px; margin-top: 4px; }
  .v-neon .dot { position: absolute; width: 9px; height: 9px; background: var(--k); border-radius: 2px; box-shadow: 0 0 8px color-mix(in srgb, var(--k) 80%, transparent); }
  .v-neon .pin .dot { left: -5px; top: 40px; background: #0a0f16; border: 1px solid var(--k); }
  .v-neon .pout .dot { right: -5px; }
  .v-neon .pout .dot.p0 { top: 40px; }
  .v-neon .pout.multi .dot.p0 { top: 30px; }
  .v-neon .pout.multi .dot.p1 { top: 56px; }
  .v-neon .plabel { position: absolute; right: 10px; font: 9px ui-monospace, Menlo, monospace; color: color-mix(in srgb, var(--k) 75%, #94a3b8); }

  /* ---------- 8. BRUTALIST ---------- */
  .v-brutal .stage { background: #f5f1e8; }
  .v-brutal .node { width: 206px; background: #fff; border: 2.5px solid #111; box-shadow: 6px 6px 0 #111; }
  .v-brutal .head { background: var(--k); border-bottom: 2.5px solid #111; padding: 6px 9px; display: flex; align-items: center; gap: 7px;
    color: #111; font: 800 10px ui-sans-serif; letter-spacing: .1em; }
  .v-brutal .head svg { width: 13px; height: 13px; }
  .v-brutal .body { padding: 9px; }
  .v-brutal .t { font: 750 14px ui-sans-serif; letter-spacing: -.01em; }
  .v-brutal .m { font: 10.5px ui-monospace, Menlo, monospace; color: #555; margin-top: 3px; }
  .v-brutal .dot { position: absolute; width: 12px; height: 12px; background: #111; border: 2.5px solid #111; }
  .v-brutal .pin .dot { left: -8px; top: 40px; background: #fff; }
  .v-brutal .pout .dot { right: -8px; }
  .v-brutal .pout .dot.p0 { top: 40px; }
  .v-brutal .pout.multi .dot.p0 { top: 44px; }
  .v-brutal .pout.multi .dot.p1 { top: 72px; }
  .v-brutal .plabel { position: absolute; right: 8px; font: 800 9px ui-sans-serif; letter-spacing: .08em; color: #111; }

  /* ---------- 9. WORK TICKET ---------- */
  .v-ticket .stage { background: #eae6dd; }
  .v-ticket .node { width: 212px; background: #fffdf7; border-radius: 6px;
    box-shadow: 0 1px 0 rgba(120,110,90,.35), 0 14px 26px -18px rgba(80,70,50,.8); }
  .v-ticket .stub { display: flex; align-items: center; gap: 7px; padding: 8px 11px; color: var(--k);
    font: 700 9.5px ui-sans-serif; letter-spacing: .14em; border-bottom: 1.5px dashed #d9d2c2; }
  .v-ticket .stub svg { width: 12px; height: 12px; }
  .v-ticket .stub .no { margin-left: auto; font: 600 9.5px ui-monospace, Menlo, monospace; color: #a89c82; letter-spacing: 0; }
  .v-ticket .body { padding: 10px 11px 12px; }
  .v-ticket .t { font: 620 13.5px ui-sans-serif; color: #2b2418; }
  .v-ticket .m { font: 10.5px ui-monospace, Menlo, monospace; color: #9a8f78; margin-top: 4px; }
  .v-ticket .perf { position: absolute; left: 0; right: 0; bottom: -1px; height: 6px;
    background: radial-gradient(circle at 5px 6px, #eae6dd 3px, transparent 3.5px) repeat-x; background-size: 10px 6px; }
  .v-ticket .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fffdf7; border: 2px solid var(--k); }
  .v-ticket .pin .dot { left: -7px; top: 44px; }
  .v-ticket .pout .dot { right: -7px; background: var(--k); }
  .v-ticket .pout .dot.p0 { top: 44px; }
  .v-ticket .pout.multi .dot.p0 { top: 32px; }
  .v-ticket .pout.multi .dot.p1 { top: 62px; }
  .v-ticket .plabel { position: absolute; right: 8px; font: 600 9px ui-sans-serif; color: #a89c82; letter-spacing: .08em; }

  /* ---------- 10. SQUIRCLE / SOFT PRODUCT ---------- */
  .v-squircle .stage { background: linear-gradient(160deg, #f8fafc, #eef2f8); }
  .v-squircle .node { width: 220px; border-radius: 18px; padding: 14px; background: #fff;
    border: 1px solid rgba(15,23,42,.07);
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 20px -10px rgba(15,23,42,.16), 0 30px 50px -30px rgba(15,23,42,.4); }
  .v-squircle .node::before { content: ""; position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--k) 10%, transparent), transparent 58%); }
  .v-squircle .rowtop { display: flex; align-items: center; gap: 11px; position: relative; }
  .v-squircle .itile { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; color: #fff;
    background: linear-gradient(145deg, color-mix(in srgb, var(--k) 78%, #fff), var(--k));
    box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--k) 85%, transparent); }
  .v-squircle .itile svg { width: 19px; height: 19px; }
  .v-squircle .t { font-size: 14px; font-weight: 620; letter-spacing: -.01em; }
  .v-squircle .m { font: 11px ui-monospace, Menlo, monospace; color: #94a3b8; margin-top: 2px; }
  .v-squircle .foot { position: relative; margin-top: 11px; padding-top: 9px; border-top: 1px solid #eef2f7;
    display: flex; gap: 6px; flex-wrap: wrap; }
  .v-squircle .badge { font: 600 9.5px ui-sans-serif; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--k) 12%, #fff); color: color-mix(in srgb, var(--k) 75%, #0f172a); }
  .v-squircle .dot { position: absolute; width: 12px; height: 12px; border-radius: 5px; background: var(--k); box-shadow: 0 0 0 3px #fff, 0 0 0 4px color-mix(in srgb, var(--k) 30%, #fff); }
  .v-squircle .pin .dot { left: -6px; top: 32px; }
  .v-squircle .pout .dot { right: -6px; }
  .v-squircle .pout .dot.p0 { top: 32px; }
  .v-squircle .pout.multi .dot.p0 { top: 30px; }
  .v-squircle .pout.multi .dot.p1 { top: 66px; }

  /* ---------- 11. BLUEPRINT ---------- */
  .v-blueprint .stage { background-color: #0a2540;
    background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
  .v-blueprint .node { width: 206px; border: 1.5px solid var(--k); background: rgba(10,37,64,.55); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .v-blueprint .node::before, .v-blueprint .node::after { content: ""; position: absolute; width: 7px; height: 7px; border: 1.5px solid var(--k); }
  .v-blueprint .node::before { left: -4px; top: -4px; border-right: 0; border-bottom: 0; }
  .v-blueprint .node::after { right: -4px; bottom: -4px; border-left: 0; border-top: 0; }
  .v-blueprint .head { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-bottom: 1px dashed color-mix(in srgb, var(--k) 45%, transparent);
    color: var(--k); font-size: 9px; letter-spacing: .2em; font-weight: 700; }
  .v-blueprint .head svg { width: 11px; height: 11px; }
  .v-blueprint .head .ref { margin-left: auto; letter-spacing: 0; opacity: .7; }
  .v-blueprint .body { padding: 9px; }
  .v-blueprint .t { color: #eaf2fb; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .v-blueprint .m { color: rgba(234,242,251,.45); font-size: 10px; margin-top: 4px; }
  .v-blueprint .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--k); background: #0a2540; }
  .v-blueprint .pin .dot { left: -5px; top: 40px; }
  .v-blueprint .pout .dot { right: -5px; background: var(--k); }
  .v-blueprint .pout .dot.p0 { top: 40px; }
  .v-blueprint .pout.multi .dot.p0 { top: 30px; }
  .v-blueprint .pout.multi .dot.p1 { top: 56px; }
  .v-blueprint .plabel { position: absolute; right: 9px; font: 9px ui-monospace, Menlo, monospace; color: color-mix(in srgb, var(--k) 80%, #fff); letter-spacing: .1em; }

  /* ---------- 12. STUDIO DARK ---------- */
  .v-studio .stage { background-color: #1a1a1d;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 24px 24px; }
  .v-studio .node { width: 210px; background: #26262b; border: 1px solid #35353c; border-radius: 7px;
    box-shadow: 0 10px 22px -12px rgba(0,0,0,.9); }
  .v-studio .head { display: flex; align-items: center; gap: 7px; padding: 7px 10px; background: var(--k);
    border-radius: 6px 6px 0 0; color: #fff; font: 650 12px ui-sans-serif; }
  .v-studio .head svg { width: 13px; height: 13px; }
  .v-studio .body { padding: 8px 10px 10px; }
  .v-studio .m { font: 10.5px ui-monospace, Menlo, monospace; color: #8a8a94; }
  .v-studio .prow { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 7px;
    font: 500 11px ui-sans-serif; color: #c9c9d1; }
  .v-studio .prow.in { justify-content: flex-start; }
  .v-studio .dot { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--k); border: 2px solid #26262b; box-shadow: 0 0 0 1px var(--k); }
  .v-studio .pin .dot { left: -6px; top: 44px; }
  .v-studio .pout .dot { right: -6px; }
  .v-studio .pout .dot.p0 { top: 44px; }
  .v-studio .pout.multi .dot.p0 { top: 44px; }
  .v-studio .pout.multi .dot.p1 { top: 70px; }
</style>
</head>
<body>
<div class="page-h">
  <h1>F8F — node design hunt</h1>
  <p>Same graph, twelve node languages. Trigger → HTTP → If/Else → two branches.</p>
</div>
<div id="gallery"></div>

<script>
const ICONS = {
  trigger: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  action:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 6 6 6-6 6"/></svg>',
  condition:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5h7"/><path d="m15 10 3 3-3 3"/></svg>',
  output:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>',
};
const KIND_LABEL = { trigger: 'TRIGGER', action: 'ACTION', condition: 'LOGIC', output: 'OUTPUT' };

const GRAPH = [
  { id:'n1', kind:'trigger',   title:'Ticket Created',  meta:'shop.ticket.new', col:0, row:0,    outs:['out'] },
  { id:'n2', kind:'action',    title:'HTTP Request',    meta:'GET /crm/customer', col:1, row:0,  ins:['in'], outs:['out'] },
  { id:'n3', kind:'condition', title:'If / Else',       meta:'status == intake', col:2, row:0,   ins:['in'], outs:['true','false'] },
  { id:'n4', kind:'action',    title:'Send Message',    meta:'Welcome SMS',      col:3, row:-0.62, ins:['in'], outs:['out'] },
  { id:'n5', kind:'output',    title:'Notify Tech',     meta:'tech.assigned',    col:3, row:0.72,  ins:['in'] },
];
const LINKS = [
  ['n1','out','n2','in'], ['n2','out','n3','in'],
  ['n3','true','n4','in'], ['n3','false','n5','in'],
];

const LIGHT = { trigger:'#059669', action:'#2563eb', condition:'#ca8a04', output:'#e11d48' };
const DARK  = { trigger:'#34d399', action:'#60a5fa', condition:'#fbbf24', output:'#fb7185' };
const NEON  = { trigger:'#22e6a4', action:'#4cc2ff', condition:'#ffcf4d', output:'#ff6b8b' };
const BRUT  = { trigger:'#7ee787', action:'#8ab4ff', condition:'#ffd43b', output:'#ff8fa3' };
const BLUE  = { trigger:'#7fe3c4', action:'#8ecbff', condition:'#ffd88a', output:'#ffa3b5' };

const dot = (n, port, dir, i) =>
  `<i class="dot p${i}" data-node="${n.id}" data-port="${port}" data-dir="${dir}"></i>`;
const outs = (n) => n.outs || [];
const dotLabelled = (n, p, d, i) =>
  (outs(n).length > 1 ? `<span class="plabel l${i}">${p}</span>` : '') + dot(n, p, d, i);
const ins = (n) => n.ins || [];
const pinBlock = (n, tpl) => ins(n).length ? `<div class="pin">${ins(n).map((p,i)=>tpl(n,p,'in',i)).join('')}</div>` : '';

function poutBlock(n, tpl) {
  if (!outs(n).length) return '';
  const multi = outs(n).length > 1 ? ' multi' : '';
  return `<div class="pout${multi}">${outs(n).map((p,i)=>tpl(n,p,'out',i)).join('')}</div>`;
}

const VARIANTS = [
  {
    slug:'card', name:'Card', tags:'square · light · header band',
    why:'The safe classic: coloured kind band, title, one line of config. Reads instantly, scales to 60 nodes.',
    palette:LIGHT, colW:250, rowH:150, baseY:105, wire:{mode:'bezier', w:2.2, color:'kind'},
    tpl: n => `<div class="node k-${n.kind}" style="--k:${LIGHT[n.kind]}">
      <div class="head">${ICONS[n.kind]}${KIND_LABEL[n.kind]}</div>
      <div class="body"><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
      ${pinBlock(n, (n,p,d,i)=>dot(n,p,d,i))}
      ${outs(n).length ? `<div class="pout${outs(n).length>1?' multi':''}">${outs(n).map((p,i)=>
        `<div class="prow">${outs(n).length>1?`<em>${p}</em>`:''}${dot(n,p,'out',i)}</div>`).join('')}</div>` : ''}
    </div>`,
  },
  {
    slug:'rail', name:'Spine Rail', tags:'square · light · colour spine',
    why:'No header band — a 5px coloured spine carries the kind. Quieter, more “app”, gives the title top billing.',
    palette:LIGHT, colW:255, rowH:150, baseY:105, wire:{mode:'bezier', w:2.2, color:'kind'},
    tpl: n => `<div class="node" style="--k:${LIGHT[n.kind]}">
      <div class="spine"></div>
      <div class="inner">
        <div class="kind">${ICONS[n.kind]}${KIND_LABEL[n.kind]}</div>
        <div class="t">${n.title}</div><div class="m">${n.meta}</div>
      </div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
      ${outs(n).length ? `<div class="pout${outs(n).length>1?' multi':''}">${outs(n).map((p,i)=>
        `<div class="prow">${outs(n).length>1?`<em>${p}</em>`:''}${dot(n,p,'out',i)}</div>`).join('')}</div>` : ''}
    </div>`,
  },
  {
    slug:'round', name:'Orbit', tags:'round · light · icon disc',
    why:'Fully circular. Gorgeous and airy at a glance, but the config line lives outside the shape and long titles wrap.',
    palette:LIGHT, colW:215, rowH:150, baseY:100, wire:{mode:'bezier', w:2.4, color:'kind'},
    tpl: n => `<div class="node" style="--k:${LIGHT[n.kind]}">
      <div class="disc">${ICONS[n.kind]}</div>
      <div class="t">${n.title}</div><div class="m">${n.meta}</div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}${poutBlock(n, dotLabelled)}
    </div>`,
  },
  {
    slug:'pill', name:'Capsule', tags:'round · light · one-line',
    why:'A single rounded row: avatar, title, config. Very calm, very dense vertically — branches get cramped though.',
    palette:LIGHT, colW:255, rowH:130, baseY:120, wire:{mode:'bezier', w:2.2, color:'kind'},
    tpl: n => `<div class="node" style="--k:${LIGHT[n.kind]}">
      <div class="avatar">${ICONS[n.kind]}</div>
      <div><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}${poutBlock(n, dotLabelled)}
    </div>`,
  },
  {
    slug:'chip', name:'Dense Chip', tags:'square · light · minimal',
    why:'The zoom-out look. 36px tall, no chrome. Best when a workflow has 40+ steps and you navigate more than you read.',
    palette:LIGHT, colW:250, rowH:120, baseY:130, wire:{mode:'bezier', w:1.8, color:'kind'},
    tpl: n => `<div class="node" style="--k:${LIGHT[n.kind]}">
      <div class="swatch">${ICONS[n.kind]}</div>
      <div class="t">${n.title}</div><div class="m">${n.meta}</div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
      ${outs(n).length ? `<div class="pout${outs(n).length>1?' multi':''}">${outs(n).map((p,i)=>dot(n,p,'out',i)).join('')}</div>` : ''}
    </div>`,
  },
  {
    slug:'glass', name:'Glass', tags:'square · dark · frosted',
    why:'Translucent panes over a lit canvas. Premium and modern; needs a dark host and costs GPU on big graphs.',
    palette:DARK, colW:255, rowH:150, baseY:100, wire:{mode:'bezier', w:2.2, color:'kind', glow:true},
    tpl: n => `<div class="node" style="--k:${DARK[n.kind]}">
      <div class="kind">${ICONS[n.kind]}${KIND_LABEL[n.kind]}</div>
      <div class="t">${n.title}</div><div class="m">${n.meta}</div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
      ${outs(n).length>1 ? `<div class="pout multi">${outs(n).map((p,i)=>
        `<span class="plabel" style="top:${16+i*30}px">${p}</span>${dot(n,p,'out',i)}`).join('')}</div>`
        : poutBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
    </div>`,
  },
  {
    slug:'neon', name:'Neon Terminal', tags:'square · dark · monospace',
    why:'Console energy — mono type, hairline kind-coloured frames, glowing links. Feels like tooling for engineers.',
    palette:NEON, colW:250, rowH:150, baseY:100, wire:{mode:'bezier', w:1.8, color:'kind', glow:true},
    tpl: n => `<div class="node" style="--k:${NEON[n.kind]}">
      <div class="head">${ICONS[n.kind]}${KIND_LABEL[n.kind]}</div>
      <div class="body"><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
      ${outs(n).length>1 ? `<div class="pout multi">${outs(n).map((p,i)=>
        `<span class="plabel" style="top:${24+i*26}px">${p}</span>${dot(n,p,'out',i)}`).join('')}</div>`
        : poutBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
    </div>`,
  },
  {
    slug:'brutal', name:'Brutalist', tags:'square · light · hard shadow',
    why:'2.5px ink outlines, offset shadow, zero radius. Maximum personality and contrast; loud in a long session.',
    palette:BRUT, colW:255, rowH:155, baseY:100, wire:{mode:'ortho', w:2.5, color:'#111'},
    tpl: n => `<div class="node" style="--k:${BRUT[n.kind]}">
      <div class="head">${ICONS[n.kind]}${KIND_LABEL[n.kind]}</div>
      <div class="body"><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
      ${outs(n).length>1 ? `<div class="pout multi">${outs(n).map((p,i)=>
        `<span class="plabel" style="top:${41+i*28}px">${p.toUpperCase()}</span>${dot(n,p,'out',i)}`).join('')}</div>`
        : poutBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
    </div>`,
  },
  {
    slug:'ticket', name:'Work Ticket', tags:'square · paper · domain-flavoured',
    why:'Each step is a torn work order — perforation, stub, job number. On-brand for a repair shop, unusual for a graph.',
    palette:LIGHT, colW:255, rowH:155, baseY:100, wire:{mode:'bezier', w:2, color:'#8b7f66'},
    tpl: (n,_,i) => `<div class="node" style="--k:${LIGHT[n.kind]}">
      <div class="stub">${ICONS[n.kind]}${KIND_LABEL[n.kind]}<span class="no">#WO-${104+i}</span></div>
      <div class="body"><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
      <div class="perf"></div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
      ${outs(n).length>1 ? `<div class="pout multi">${outs(n).map((p,i)=>
        `<span class="plabel" style="top:${14+i*30}px">${p}</span>${dot(n,p,'out',i)}`).join('')}</div>`
        : poutBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
    </div>`,
  },
  {
    slug:'squircle', name:'Soft Product', tags:'squircle · light · gradient tile',
    why:'Big radius, gradient icon tile, port chips in a footer. The most “shipped SaaS” of the set — friendly, roomy.',
    palette:LIGHT, colW:265, rowH:165, baseY:95, wire:{mode:'bezier', w:2.4, color:'kind'},
    tpl: n => `<div class="node" style="--k:${LIGHT[n.kind]}">
      <div class="rowtop"><div class="itile">${ICONS[n.kind]}</div>
        <div><div class="t">${n.title}</div><div class="m">${n.meta}</div></div></div>
      ${outs(n).length>1 ? `<div class="foot">${outs(n).map(p=>`<span class="badge">${p.toUpperCase()}</span>`).join('')}</div>` : ''}
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}${poutBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
    </div>`,
  },
  {
    slug:'blueprint', name:'Blueprint', tags:'square · dark · outline only',
    why:'Drafting table: outline nodes, corner ticks, part refs, right-angle routing. Technical and precise, low ink.',
    palette:BLUE, colW:250, rowH:150, baseY:100, wire:{mode:'ortho', w:1.5, color:'kind', dash:'5 4'},
    tpl: (n,_,i) => `<div class="node" style="--k:${BLUE[n.kind]}">
      <div class="head">${ICONS[n.kind]}${KIND_LABEL[n.kind]}<span class="ref">N-0${i+1}</span></div>
      <div class="body"><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
      ${outs(n).length>1 ? `<div class="pout multi">${outs(n).map((p,i)=>
        `<span class="plabel" style="top:${24+i*26}px">${p.toUpperCase()}</span>${dot(n,p,'out',i)}`).join('')}</div>`
        : poutBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
    </div>`,
  },
  {
    slug:'studio', name:'Studio Dark', tags:'square · dark · port rows',
    why:'The Blender/Unreal convention: solid kind header, labelled port rows inside the body. Familiar to node people.',
    palette:DARK, colW:255, rowH:150, baseY:100, wire:{mode:'bezier', w:2.4, color:'kind'},
    tpl: n => `<div class="node" style="--k:${DARK[n.kind]}">
      <div class="head">${ICONS[n.kind]}${n.title}</div>
      <div class="body"><div class="m">${n.meta}</div>
        ${outs(n).map(p=>`<div class="prow">${p}</div>`).join('')}
      </div>
      ${pinBlock(n,(n,p,d,i)=>dot(n,p,d,i))}${poutBlock(n,(n,p,d,i)=>dot(n,p,d,i))}
    </div>`,
  },
];

const gallery = document.getElementById('gallery');
VARIANTS.forEach((V, vi) => {
  const tile = document.createElement('section');
  tile.className = 'tile v-' + V.slug;
  tile.id = 'tile-' + V.slug;
  tile.innerHTML = `
    <div class="tile-h">
      <span class="num">${String(vi+1).padStart(2,'0')}</span>
      <h2>${V.name}</h2><span class="tag">${V.tags}</span>
      <span class="why">${V.why}</span>
    </div>
    <div class="stage"><svg class="wires"></svg></div>`;
  gallery.appendChild(tile);

  const stage = tile.querySelector('.stage');
  GRAPH.forEach((n, i) => {
    const holder = document.createElement('div');
    holder.innerHTML = V.tpl(n, V, i).trim();
    const el = holder.firstElementChild;
    el.style.left = (28 + n.col * V.colW) + 'px';
    el.style.top = (V.baseY + n.row * V.rowH) + 'px';
    el.dataset.id = n.id;
    stage.appendChild(el);
  });
});

// Measure real port positions and draw the wires.
requestAnimationFrame(() => {
  VARIANTS.forEach(V => {
    const stage = document.querySelector('#tile-' + V.slug + ' .stage');
    const svg = stage.querySelector('svg.wires');
    const sb = stage.getBoundingClientRect();
    const at = (nid, port, dir) => {
      const d = stage.querySelector(`.dot[data-node="${nid}"][data-port="${port}"][data-dir="${dir}"]`);
      if (!d) return null;
      const r = d.getBoundingClientRect();
      return { x: r.left - sb.left + r.width / 2, y: r.top - sb.top + r.height / 2 };
    };
    let out = '';
    LINKS.forEach(([a, ap, b, bp]) => {
      const p = at(a, ap, 'out'), q = at(b, bp, 'in');
      if (!p || !q) return;
      const kind = GRAPH.find(n => n.id === a).kind;
      const stroke = V.wire.color === 'kind' ? V.palette[kind] : V.wire.color;
      let d;
      if (V.wire.mode === 'ortho') {
        const mx = (p.x + q.x) / 2;
        d = `M${p.x} ${p.y} H${mx} V${q.y} H${q.x}`;
      } else {
        const dx = Math.max(40, Math.abs(q.x - p.x) * 0.5);
        d = `M${p.x} ${p.y} C${p.x + dx} ${p.y}, ${q.x - dx} ${q.y}, ${q.x} ${q.y}`;
      }
      const glow = V.wire.glow ? `filter="url(#glow-${V.slug})"` : '';
      const dash = V.wire.dash ? `stroke-dasharray="${V.wire.dash}"` : '';
      out += `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${V.wire.w}" stroke-linecap="round" ${dash} ${glow}/>`;
      out += `<circle cx="${q.x}" cy="${q.y}" r="0"/>`;
    });
    svg.innerHTML =
      `<defs><filter id="glow-${V.slug}" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter></defs>` + out;
    document.body.dataset.wired = 'yes';
  });
});
</script>
</body>
</html>
