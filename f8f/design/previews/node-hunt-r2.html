<script>
const ICONS = {
  trigger:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  action:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 6 6 6-6 6"/></svg>',
  condition:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5h7"/><path d="m15 10 3 3-3 3"/></svg>',
  transform:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>',
  output:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>',
};
const KIND_LABEL = { trigger:'TRIGGER', action:'ACTION', condition:'LOGIC', transform:'TRANSFORM', output:'OUTPUT' };
const LIGHT = { trigger:'#059669', action:'#2563eb', condition:'#ca8a04', transform:'#9333ea', output:'#e11d48' };
const DARK  = { trigger:'#34d399', action:'#60a5fa', condition:'#fbbf24', transform:'#c084fc', output:'#fb7185' };

// hero graph — a preview run in flight
const HERO = [
  { id:'n1', kind:'trigger',   title:'Ticket Created', meta:'shop.ticket.new',   col:0, row:0,     st:'success',  outs:['out'] },
  { id:'n2', kind:'action',    title:'HTTP Request',   meta:'GET /crm/customer', col:1, row:0,     st:'success',  ins:['in'], outs:['out'] },
  { id:'n3', kind:'condition', title:'If / Else',      meta:'status == intake',  col:2, row:0,     st:'selected', ins:['in'], outs:['true','false'] },
  { id:'n4', kind:'action',    title:'Send Message',   meta:'Welcome SMS',       col:3, row:-0.62, st:'running',  ins:['in'], outs:['out'] },
  { id:'n5', kind:'output',    title:'Notify Tech',    meta:'tech.assigned',     col:3, row:0.72,  st:'idle',     ins:['in'] },
];
const HERO_LINKS = [['n1','out','n2','in'],['n2','out','n3','in'],['n3','true','n4','in'],['n3','false','n5','in']];

// zoomed-out density check — a workflow with some actual size to it
const DENSE = [
  { id:'d1', kind:'trigger',   title:'Ticket Created', meta:'shop.ticket.new',    col:0, row:0,     st:'success', outs:['out'] },
  { id:'d2', kind:'action',    title:'HTTP Request',   meta:'GET /crm/customer',  col:1, row:0,     st:'success', ins:['in'], outs:['out'] },
  { id:'d3', kind:'condition', title:'If / Else',      meta:'status == intake',   col:2, row:0,     st:'idle',    ins:['in'], outs:['true','false'] },
  { id:'d4', kind:'transform', title:'Format SMS',     meta:'{{customer.name}}',  col:3, row:-0.78, st:'idle',    ins:['in'], outs:['out'] },
  { id:'d5', kind:'action',    title:'Assign Tech',    meta:'queue: intake',      col:3, row:0.78,  st:'idle',    ins:['in'], outs:['out'] },
  { id:'d6', kind:'action',    title:'Send Message',   meta:'Welcome SMS',        col:4, row:-0.78, st:'idle',    ins:['in'], outs:['out'] },
  { id:'d7', kind:'output',    title:'Notify Tech',    meta:'tech.assigned',      col:4, row:0.78,  st:'idle',    ins:['in'] },
  { id:'d8', kind:'output',    title:'Log Event',      meta:'audit.workflow',     col:5, row:-0.78, st:'idle',    ins:['in'] },
];
const DENSE_LINKS = [['d1','out','d2','in'],['d2','out','d3','in'],['d3','true','d4','in'],['d3','false','d5','in'],
  ['d4','out','d6','in'],['d5','out','d7','in'],['d6','out','d8','in']];

const STATES = ['idle','selected','running','success','error','collapsed'];
const STATE_NODE = { id:'s1', kind:'action', title:'HTTP Request', meta:'GET /crm/customer', ins:['in'], outs:['out'] };
const STATE_BRANCH = { id:'s2', kind:'condition', title:'If / Else', meta:'status == intake', ins:['in'], outs:['true','false'] };

const dot = (n, p, d, i) => `<i class="dot p${i}" data-node="${n.id}" data-port="${p}" data-dir="${d}"></i>`;
const outs = n => n.outs || [], ins = n => n.ins || [];
const labelled = (n, p, d, i) => (outs(n).length > 1 ? `<span class="plabel l${i}">${p}</span>` : '') + dot(n, p, d, i);
const pin = n => ins(n).length ? `<div class="pin">${ins(n).map((p,i)=>dot(n,p,'in',i)).join('')}</div>` : '';
const pout = (n, f = dot) => outs(n).length
  ? `<div class="pout${outs(n).length>1?' multi':''}">${outs(n).map((p,i)=>f(n,p,'out',i)).join('')}</div>` : '';

const CHIP = { success:'<span class="chip ok">0.4s</span>', running:'<span class="chip live">RUNNING</span>',
               error:'<span class="chip bad">FAILED</span>' };

const VARIANTS = [
  {
    slug:'glass', name:'Glass', tags:'dark · frosted · glow states',
    why:'States ride on light: the kind hairline, a glow ring for selection, a progress sliver while running, a red halo on failure.',
    palette:DARK, colW:258, rowH:150, baseY:98, denseK:.62, denseColW:250, denseRowH:150, denseY:190,
    wire:{ w:2.2, glow:true },
    tpl: (n, st) => `<div class="node st-${st}" style="--k:${DARK[n.kind]}">
      <div class="kind">${ICONS[n.kind]}${st==='collapsed' ? `<span style="color:#f1f5f9;letter-spacing:0;font-size:12px;font-weight:600">${n.title}</span>` : KIND_LABEL[n.kind]}${CHIP[st]||''}</div>
      ${st==='collapsed' ? '' : `<div class="t">${n.title}</div><div class="m">${n.meta}</div>`}
      ${st==='error' ? '<div class="err">502 · /crm/customer</div>' : ''}
      ${st==='running' ? '<div class="runbar"><i></i></div>' : ''}
      ${pin(n)}${pout(n, labelled)}</div>`,
  },
  {
    slug:'soft', name:'Soft Product', tags:'light · squircle · gradient tile',
    why:'The light-theme twin of Glass. Same information, same states, expressed with rings and chips instead of glow.',
    palette:LIGHT, colW:268, rowH:162, baseY:92, denseK:.62, denseColW:265, denseRowH:158, denseY:186,
    wire:{ w:2.4 },
    tpl: (n, st) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
      <div class="rowtop"><div class="itile">${ICONS[n.kind]}</div>
        <div><div class="t">${n.title}</div>${st==='collapsed' ? '' : `<div class="m">${n.meta}</div>`}</div>
        ${CHIP[st]||''}</div>
      ${st==='error' ? '<div class="err">502 · /crm/customer</div>' : ''}
      ${st==='running' ? '<div class="runbar"><i></i></div>' : ''}
      ${st!=='collapsed' && outs(n).length>1 ? `<div class="foot">${outs(n).map(p=>`<span class="badge">${p.toUpperCase()}</span>`).join('')}</div>` : ''}
      ${pin(n)}${pout(n)}</div>`,
  },
  {
    slug:'orbit', name:'Orbit', tags:'round · light · ring is the status',
    why:'The ring around each disc doubles as the run indicator — it fills as the step executes, greens on success, reds on failure.',
    palette:LIGHT, colW:212, rowH:158, baseY:92, denseK:.66, denseColW:205, denseRowH:150, denseY:182,
    wire:{ w:2.4 },
    tpl: (n, st) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
      <div class="disc">${ICONS[n.kind]}</div>
      ${st==='success'?'<span class="badge ok">0.4s</span>':st==='running'?'<span class="badge live">RUNNING</span>':st==='error'?'<span class="badge bad">FAILED</span>':''}
      <div class="t">${n.title}</div><div class="m">${n.meta}</div>
      ${pin(n)}${pout(n, labelled)}</div>`,
  },
  {
    slug:'plate', name:'Orbit Plate', tags:'round + plate · light · hybrid',
    why:'Orbit with the label brought inside — a disc welded to a rounded plate. Keeps the circular read, fixes the wrapping title.',
    palette:LIGHT, colW:268, rowH:132, baseY:112, denseK:.64, denseColW:262, denseRowH:128, denseY:196,
    wire:{ w:2.2 },
    tpl: (n, st) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
      <div class="disc">${ICONS[n.kind]}</div>
      ${st==='collapsed' ? '' : `<div class="plate"><div class="t">${n.title}</div>
        ${st==='error' ? '<div class="m" style="color:#b91c1c">502 · /crm/customer</div>' : `<div class="m">${n.meta}</div>`}</div>`}
      ${pin(n)}${pout(n, labelled)}</div>`,
  },
  {
    slug:'ticket', name:'Work Ticket', tags:'paper · perforated · rubber stamp',
    why:'Every step is a torn job ticket — stub, tear line, barcode, and a rubber stamp for the run result. Nothing else looks like it.',
    palette:LIGHT, colW:264, rowH:162, baseY:88, denseK:.6, denseColW:258, denseRowH:158, denseY:180,
    wire:{ w:2, color:'#8a7a5c' },
    tpl: (n, st, i) => `<div class="node st-${st}" style="--k:${LIGHT[n.kind]}">
      <div class="stub">${ICONS[n.kind]}${KIND_LABEL[n.kind]}<span class="no">#WO-${104+(i||0)}</span></div>
      <div class="tear"></div>
      <div class="body"><div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
      ${st==='error' ? '<div class="err">502 · /crm/customer</div>' : ''}
      ${st==='success'?'<span class="stamp ok">DONE</span>':st==='running'?'<span class="stamp live">RUNNING</span>':st==='error'?'<span class="stamp bad">FAILED</span>':''}
      <div class="barcode"></div><div class="perf"></div>
      ${pin(n)}${pout(n, labelled)}</div>`,
  },
];

const gallery = document.getElementById('gallery');

function buildStage(host, V, nodes, links, k, colW, rowH, baseY, cls) {
  const stage = document.createElement('div');
  stage.className = 'stage ' + cls;
  stage.innerHTML = '<div class="zoomwrap"><svg class="wires"></svg></div>';
  host.appendChild(stage);
  const wrap = stage.querySelector('.zoomwrap');
  wrap.style.transform = `scale(${k})`;
  wrap.style.width = (100 / k) + '%';
  wrap.style.height = (100 / k) + '%';
  nodes.forEach((n, i) => {
    const box = document.createElement('div');
    box.innerHTML = V.tpl(n, n.st || 'idle', i).trim();
    const el = box.firstElementChild;
    el.style.left = (28 + n.col * colW) + 'px';
    el.style.top = (baseY + n.row * rowH) + 'px';
    wrap.appendChild(el);
  });
  return { stage, wrap, links };
}

const pending = [];
VARIANTS.forEach((V, vi) => {
  const tile = document.createElement('section');
  tile.className = 'tile v-' + V.slug;
  tile.id = 'tile-' + V.slug;
  tile.innerHTML = `<div class="tile-h"><span class="num">${String(vi+1).padStart(2,'0')}</span>
      <h2>${V.name}</h2><span class="tag">${V.tags}</span><span class="why">${V.why}</span></div>
    <div class="sec-l">Preview running · one node selected</div>`;
  gallery.appendChild(tile);

  pending.push(buildStage(tile, V, HERO, HERO_LINKS, 1, V.colW, V.rowH, V.baseY, 'hero'));

  const l2 = document.createElement('div');
  l2.className = 'sec-l'; l2.textContent = 'Canvas states';
  tile.appendChild(l2);
  const strip = document.createElement('div');
  strip.className = 'strip';
  strip.innerHTML = STATES.map(st => {
    const src = st === 'idle' ? STATE_BRANCH : STATE_NODE;
    return `<div class="cell">${V.tpl(src, st, 1)}<div class="cap">${st === 'idle' ? 'idle · branching' : st}</div></div>`;
  }).join('');
  tile.appendChild(strip);

  const l3 = document.createElement('div');
  l3.className = 'sec-l'; l3.textContent = 'Zoomed out — eight steps';
  tile.appendChild(l3);
  pending.push(buildStage(tile, V, DENSE, DENSE_LINKS, V.denseK, V.denseColW, V.denseRowH, V.denseY, 'dense'));
  pending[pending.length - 1].k = V.denseK;
  pending[pending.length - 1].V = V;
  pending[pending.length - 2].k = 1;
  pending[pending.length - 2].V = V;
});

requestAnimationFrame(() => {
  pending.forEach(({ wrap, links, k, V }) => {
    const svg = wrap.querySelector('svg.wires');
    const wb = wrap.getBoundingClientRect();
    const at = (nid, port, dir) => {
      const d = wrap.querySelector(`.dot[data-node="${nid}"][data-port="${port}"][data-dir="${dir}"]`);
      if (!d) return null;
      const r = d.getBoundingClientRect();
      // rects are in screen space; divide back out the zoom to get user units
      return { x: (r.left - wb.left + r.width / 2) / k, y: (r.top - wb.top + r.height / 2) / k };
    };
    const all = [...HERO, ...DENSE];
    let out = '';
    links.forEach(([a, ap, b, bp]) => {
      const p = at(a, ap, 'out'), q = at(b, bp, 'in');
      if (!p || !q) return;
      const src = all.find(n => n.id === a);
      const stroke = V.wire.color || V.palette[src.kind];
      const dx = Math.max(42, Math.abs(q.x - p.x) * 0.5);
      const d = `M${p.x} ${p.y} C${p.x + dx} ${p.y}, ${q.x - dx} ${q.y}, ${q.x} ${q.y}`;
      const glow = V.wire.glow ? `filter="url(#glow-${V.slug})"` : '';
      const dash = (src.st === 'idle' || !src.st) && V.slug === 'ticket' ? '' : '';
      out += `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${V.wire.w}" stroke-linecap="round" ${dash} ${glow}/>`;
    });
    svg.innerHTML = `<defs><filter id="glow-${V.slug}" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter></defs>` + out;
  });
  document.body.dataset.wired = 'yes';
});
</script>
</body>
</html>
