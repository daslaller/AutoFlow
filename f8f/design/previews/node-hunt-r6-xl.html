<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>F8F — Orbit XL, hairline + neutral glyph</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eceff3; color: #0f172a; padding: 28px; }
  .page-h { max-width: 1160px; margin: 0 auto 22px; }
  .page-h h1 { font-size: 20px; margin: 0 0 4px; }
  .page-h p { margin: 0; font-size: 13px; color: #64748b; max-width: 780px; }
  .tile { max-width: 1160px; margin: 0 auto 26px; background: #fff; border-radius: 14px;
    border: 1px solid #dde3ec; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
  .tile-h { padding: 14px 18px; border-bottom: 1px solid #eef2f7; display: flex; align-items: baseline; gap: 10px; }
  .tile-h .num { font: 600 11px ui-monospace, Menlo, monospace; color: #94a3b8; }
  .tile-h h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .tile-h .tag { font-size: 11px; color: #64748b; }
  .tile-h .why { margin-left: auto; font-size: 12px; color: #64748b; max-width: 520px; text-align: right; }
  .sec-l { padding: 8px 18px; font: 600 10px ui-sans-serif; letter-spacing: .14em; text-transform: uppercase;
    color: #94a3b8; background: #fbfcfe; border-top: 1px solid #eef2f7; border-bottom: 1px solid #eef2f7; }

  .stage { position: relative; overflow: hidden; background: radial-gradient(130% 110% at 18% 0%, #fcfdff, #e6edf7); }
  .zoomwrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .stage svg.wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 0; }
  .stage .node { position: absolute; z-index: 1; }
  .hud { position: absolute; right: 12px; bottom: 10px; z-index: 6; font: 600 11px ui-monospace, Menlo, monospace;
    color: #64748b; background: rgba(255,255,255,.85); border: 1px solid #e2e8f0; border-radius: 6px; padding: 3px 8px; }
  .strip { display: flex; flex-wrap: wrap; gap: 26px 30px; padding: 34px 24px 24px;
    background: radial-gradient(130% 110% at 18% 0%, #fcfdff, #e6edf7); }
  .strip .node { position: relative; }
  .strip .cap { margin-top: 16px; font: 600 10px ui-sans-serif; letter-spacing: .12em; text-transform: uppercase;
    color: #94a3b8; text-align: center; width: 186px; }
  .strip .cap b { display: block; font-size: 10px; letter-spacing: .04em; text-transform: none;
    color: #64748b; font-weight: 500; margin-top: 3px; }

  /* ---------- Orbit XL: 140px disc, 1px ring, slight glow, neutral glyph ---------- */
  .node { width: 186px; text-align: center;
    --disc: 140px; --ringw: 1px; --icon: 46px;
    --glowc: var(--k); --gb: 18px; --gs: -5px; --ga: 38%;
    --glyph: #0f172a; }
  .disc { width: var(--disc); height: var(--disc); margin: 0 auto; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 50% 26%, #ffffff, #fdfdfe);
    display: grid; place-items: center;
    box-shadow: 0 10px 22px -14px rgba(15,23,42,.34), 0 1px 2px rgba(15,23,42,.05); }
  .disc::before { content: ""; position: absolute; inset: calc(var(--ringw) * -1); border-radius: 50%; z-index: 0;
    background: conic-gradient(var(--ring, var(--k)) var(--pct, 100%), #dde5ef 0);
    box-shadow: 0 0 var(--gb) var(--gs) color-mix(in srgb, var(--glowc) var(--ga), transparent); }
  .disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; z-index: 1;
    background: radial-gradient(circle at 50% 26%, #ffffff, #fdfdfe); }
  .disc svg { width: var(--icon); height: var(--icon); position: relative; z-index: 2; color: var(--glyph); }

  .labels { position: relative; z-index: 2; margin: 0 auto; transform-origin: 50% 0;
    transform: scale(var(--ls, 1)); width: var(--lw, 186px); }
  .kindlabel { margin-top: 14px; font: 700 9.5px ui-sans-serif; letter-spacing: .16em;
    color: color-mix(in srgb, var(--k) 80%, #64748b); }
  .t { margin-top: 4px; font-size: 16px; font-weight: 650; line-height: 1.2; letter-spacing: -.012em;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .m { display: inline-block; margin-top: 7px; max-width: 100%; font: 12px ui-monospace, Menlo, monospace;
    color: #7c8899; background: rgba(255,255,255,.8); border: 1px solid #e6ecf4; border-radius: 999px;
    padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
  .lod-2 .m { display: none; }
  .lod-3 .labels { display: none; }

  .badge { position: absolute; left: 50%; top: calc(var(--disc) - 12px); z-index: 3; transform-origin: 50% 50%;
    transform: translateX(-50%) scale(var(--bs, 1));
    font: 700 9px ui-sans-serif; letter-spacing: .1em; padding: 3px 9px; border-radius: 999px; color: #fff;
    white-space: nowrap; box-shadow: 0 3px 8px -2px rgba(15,23,42,.4); }
  .badge.ok { background: #16a34a; } .badge.live { background: #2563eb; } .badge.bad { background: #dc2626; }
  .lod-2 .badge, .lod-3 .badge { display: none; }

  .node.st-selected .disc { box-shadow: 0 0 0 3.5px #fff, 0 0 0 5px rgba(15,23,42,.5), 0 10px 22px -14px rgba(15,23,42,.4); }
  .node.st-running .disc { --ring: #2563eb; --pct: 68%; --glowc: #2563eb; --ga: 55%; }
  .node.st-success .disc { --ring: #16a34a; --glowc: #16a34a; }
  .node.st-error   .disc { --ring: #dc2626; --glowc: #dc2626; --ga: 55%; }
  /* option: thicken the ring only while a step is live, so a 1px arc still reads */
  .node.ring-boost.st-running .disc, .node.ring-boost.st-error .disc { --ringw: 2.5px; }

  .dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--k);
    border: 3px solid #fff; box-shadow: 0 1px 3px rgba(15,23,42,.28); z-index: 4; }
  .pin .dot { left: 16px; top: 63px; }
  .pout .dot { right: 16px; }
  .pout .dot.p0 { top: 63px; }
  .pout.multi .dot.p0 { top: 20px; right: 26px; }
  .pout.multi .dot.p1 { top: 106px; right: 26px; }
  .plabel { position: absolute; font: 700 9px ui-sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: color-mix(in srgb, var(--k) 85%, #475569); z-index: 4; }
  .plabel.l0 { top: 6px; right: 10px; } .plabel.l1 { top: 120px; right: 8px; }
  .lod-2 .plabel, .lod-3 .plabel { display: none; }

  /* glyph weight options */
  .gy-ink   .node { --glyph: #0f172a; }
  .gy-graph .node { --glyph: #475569; }
  .gy-slate .node { --glyph: #94a3b8; }
  .gy-kind  .node { --glyph: var(--k); }
</style>
</head>
<body>
<div class="page-h">
  <h1>F8F — Orbit XL, hairline ring + neutral glyph</h1>
  <p>140px disc, 1px ring, slight glow, icons in ink rather than the kind colour. Kind now rides on the ring
     and the label only — the trade that comes with a colourless glyph.</p>
</div>
<div id="gallery"></div>
<script>
const ICONS = {
  trigger:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  action:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 6 6 6-6 6"/></svg>',
  condition:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5h7"/><path d="m15 10 3 3-3 3"/></svg>',
  transform:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>',
  output:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>',
};
const KIND_LABEL = { trigger:'TRIGGER', action:'ACTION', condition:'LOGIC', transform:'TRANSFORM', output:'OUTPUT' };
const LIGHT = { trigger:'#059669', action:'#2563eb', condition:'#ca8a04', transform:'#9333ea', output:'#e11d48' };

const COLW = 276, ROWH = 200, BASEY = 150, PAD = 30, NODEW = 186;
const GRAPH = [
  { id:'n1', kind:'trigger',   title:'Ticket Created', meta:'shop.ticket.new',   col:0, row:0,     st:'success',  outs:['out'] },
  { id:'n2', kind:'action',    title:'HTTP Request',   meta:'GET /crm/customer', col:1, row:0,     st:'success',  ins:['in'], outs:['out'] },
  { id:'n3', kind:'condition', title:'If / Else',      meta:'status == intake',  col:2, row:0,     st:'selected', ins:['in'], outs:['true','false'] },
  { id:'n4', kind:'action',    title:'Send Message',   meta:'Welcome SMS',       col:3, row:-0.72, st:'running',  ins:['in'], outs:['out'] },
  { id:'n5', kind:'output',    title:'Notify Tech',    meta:'tech.assigned',     col:3, row:0.80,  st:'idle',     ins:['in'] },
];
const LINKS = [['n1','out','n2','in'],['n2','out','n3','in'],['n3','true','n4','in'],['n3','false','n5','in']];
const WORLD_W = PAD + 3 * COLW + NODEW;

const dot = (n,p,d,i) => `<i class="dot p${i}" data-node="${n.id}" data-port="${p}" data-dir="${d}"></i>`;
const outs = n => n.outs || [], ins = n => n.ins || [];
const labelled = (n,p,d,i) => (outs(n).length>1 ? `<span class="plabel l${i}">${p}</span>` : '') + dot(n,p,d,i);
const pinB = n => ins(n).length ? `<div class="pin">${ins(n).map((p,i)=>dot(n,p,'in',i)).join('')}</div>` : '';
const poutB = n => outs(n).length
  ? `<div class="pout${outs(n).length>1?' multi':''}">${outs(n).map((p,i)=>labelled(n,p,'out',i)).join('')}</div>` : '';
const badge = st => st==='success' ? '<span class="badge ok">0.4s</span>'
  : st==='running' ? '<span class="badge live">RUNNING</span>'
  : st==='error' ? '<span class="badge bad">FAILED</span>' : '';

const tpl = (n, extra = '') => `<div class="node st-${n.st||'idle'} ${extra}" style="--k:${LIGHT[n.kind]}">
  <div class="disc">${ICONS[n.kind]}</div>${badge(n.st)}
  <div class="labels"><div class="kindlabel">${KIND_LABEL[n.kind]}</div>
    <div class="t">${n.title}</div><div class="m">${n.meta}</div></div>
  ${pinB(n)}${poutB(n)}</div>`;

const PIN = 0.70, LOD2 = 0.40, LOD3 = 0.22;
const lodFor = z => {
  const ls = Math.max(1, PIN / z);
  return { ls, lw: (COLW - 20) / ls, bs: Math.max(1, 0.55 / z),
           cls: z < LOD3 ? 'lod-3' : z < LOD2 ? 'lod-2' : '' };
};

const pending = [];
function buildStage(host, { z = 1, h, hud, extra = '' }) {
  const stage = document.createElement('div');
  stage.className = 'stage';
  stage.style.height = h + 'px';
  stage.innerHTML = `<div class="zoomwrap"><svg class="wires"></svg></div>` +
    (hud ? `<div class="hud">${hud}</div>` : '');
  host.appendChild(stage);
  const wrap = stage.querySelector('.zoomwrap');
  const offX = Math.max(0, (1158 - WORLD_W * z) / 2);
  wrap.style.transform = `translateX(${offX}px) scale(${z})`;
  wrap.style.width = WORLD_W + 200 + 'px';
  wrap.style.height = (h / z + 200) + 'px';
  const { ls, lw, bs, cls } = lodFor(z);
  GRAPH.forEach(n => {
    const box = document.createElement('div');
    box.innerHTML = tpl(n, extra).trim();
    const el = box.firstElementChild;
    if (z < 1) {
      if (cls) el.classList.add(cls);
      el.style.setProperty('--ls', ls);
      el.style.setProperty('--lw', lw + 'px');
      el.style.setProperty('--bs', bs);
    }
    el.style.left = (PAD + n.col * COLW) + 'px';
    el.style.top = (BASEY + n.row * ROWH) + 'px';
    wrap.appendChild(el);
  });
  pending.push({ wrap, z });
}

const gallery = document.getElementById('gallery');
function tile(id, num, name, tag, why) {
  const t = document.createElement('section');
  t.className = 'tile'; t.id = 'tile-' + id;
  t.innerHTML = `<div class="tile-h"><span class="num">${num}</span><h2>${name}</h2>
    <span class="tag">${tag}</span><span class="why">${why}</span></div>`;
  gallery.appendChild(t);
  return t;
}

// 01 — the ask
const t1 = tile('xl', '01', 'Orbit XL — hairline', '140px disc · 1px ring · ink glyph',
  'The disc is now almost entirely white space. Kind survives on a one-pixel rim and the label above the title.');
t1.className += ' gy-ink';
buildStage(t1, { h: 560, hud: 'zoom 100%' });

// 02 — glyph weight
const t2 = tile('glyph', '02', 'Glyph weight', 'four options, same node',
  'How dark the icon sits changes how much the disc reads as a button versus a diagram. Ink is the literal no-colour reading.');
[['gy-ink', 'Ink', '#0f172a — the ask'],
 ['gy-graph', 'Graphite', '#475569 — softer, less button-like'],
 ['gy-slate', 'Slate', '#94a3b8 — nearly a watermark'],
 ['gy-kind', 'Kind colour', 'for reference — what we had']].forEach(([cls, name, note], i) => {
  if (i === 0) { const l = document.createElement('div'); l.className = 'sec-l'; l.textContent = 'Icon colour'; t2.appendChild(l); }
});
const gstrip = document.createElement('div');
gstrip.className = 'strip';
gstrip.innerHTML = [['gy-ink', 'Ink', '#0f172a — the ask'],
 ['gy-graph', 'Graphite', '#475569 — softer'],
 ['gy-slate', 'Slate', '#94a3b8 — nearly a watermark'],
 ['gy-kind', 'Kind colour', 'reference — what we had']].map(([cls, name, note]) =>
  `<div class="cell ${cls}">${tpl({ id:'g'+cls, kind:'action', title:'Send Message', meta:'Welcome SMS', st:'idle', ins:['in'], outs:['out'] })}
   <div class="cap">${name}<b>${note}</b></div></div>`).join('');
t2.appendChild(gstrip);

// 03 — states
const t3 = tile('states', '03', 'States at 1px', 'the hairline under load',
  'A 1px ring is a thin thing to carry run state. The last two cells thicken the ring to 2.5px while live — the fix if the hairline reads too faint.');
const sstrip = document.createElement('div');
sstrip.className = 'strip gy-ink';
sstrip.innerHTML = [
  [{ kind:'condition', title:'If / Else', meta:'status == intake', st:'idle', ins:['in'], outs:['true','false'] }, '', 'idle · branching'],
  [{ kind:'action', title:'HTTP Request', meta:'GET /crm/customer', st:'selected', ins:['in'], outs:['out'] }, '', 'selected'],
  [{ kind:'action', title:'HTTP Request', meta:'GET /crm/customer', st:'running', ins:['in'], outs:['out'] }, '', 'running · 1px'],
  [{ kind:'action', title:'HTTP Request', meta:'GET /crm/customer', st:'success', ins:['in'], outs:['out'] }, '', 'success'],
  [{ kind:'action', title:'HTTP Request', meta:'GET /crm/customer', st:'running', ins:['in'], outs:['out'] }, 'ring-boost', 'running · boosted'],
  [{ kind:'action', title:'HTTP Request', meta:'GET /crm/customer', st:'error', ins:['in'], outs:['out'] }, 'ring-boost', 'error · boosted'],
].map(([n, extra, cap], i) => `<div class="cell">${tpl({ ...n, id: 'st' + i }, extra)}<div class="cap">${cap}</div></div>`).join('');
t3.appendChild(sstrip);

// 04 — zoom, XL pitch
const t4 = tile('zoom', '04', 'Zoom, XL pitch', 'label LOD at 276px columns',
  'XL columns are wider, so pinned labels have more room before they cap. The 1px ring is the first thing to vanish on the way out.');
t4.className += ' gy-ink';
[['55% — labels pinned', 0.55, 420], ['30% — pill and ports dropped', 0.30, 300]].forEach(([label, z, h]) => {
  const l = document.createElement('div'); l.className = 'sec-l'; l.textContent = label; t4.appendChild(l);
  buildStage(t4, { z, h, hud: `zoom ${Math.round(z * 100)}%` });
});

requestAnimationFrame(() => {
  pending.forEach(({ wrap, z }) => {
    const svg = wrap.querySelector('svg.wires');
    const wb = wrap.getBoundingClientRect();
    const at = (nid, port, dir) => {
      const d = wrap.querySelector(`.dot[data-node="${nid}"][data-port="${port}"][data-dir="${dir}"]`);
      if (!d) return null;
      const r = d.getBoundingClientRect();
      return { x: (r.left - wb.left + r.width / 2) / z, y: (r.top - wb.top + r.height / 2) / z };
    };
    let out = '';
    LINKS.forEach(([a, ap, b, bp]) => {
      const p = at(a, ap, 'out'), q = at(b, bp, 'in');
      if (!p || !q) return;
      const stroke = LIGHT[GRAPH.find(n => n.id === a).kind];
      const dx = Math.max(50, Math.abs(q.x - p.x) * 0.5);
      out += `<path d="M${p.x} ${p.y} C${p.x+dx} ${p.y}, ${q.x-dx} ${q.y}, ${q.x} ${q.y}" fill="none"
        stroke="${stroke}" stroke-width="2.4" stroke-linecap="round"/>`;
    });
    svg.innerHTML = out;
  });
  document.body.dataset.wired = 'yes';
});
</script>
</body>
</html>
